spring:
  application:
    name: lifeos-backend
  datasource:
    url: ${LIFEOS_DB_URL:jdbc:postgresql://localhost:5432/lifeos}
    username: ${LIFEOS_DB_USER:lifeos}
    password: ${LIFEOS_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  servlet:
    session:
      cookie:
        name: LIFEOS_SESSION
        http-only: true
        same-site: lax
        # Secure by default; local plain-http runs set LIFEOS_COOKIE_SECURE=false (docker-compose does).
        secure: ${LIFEOS_COOKIE_SECURE:true}
      timeout: 14d
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    root: INFO
    app.lifeos: ${LIFEOS_LOG_LEVEL:INFO}   # DEBUG adds anonymous 401s and health checks
    org.springframework.security: WARN
    org.hibernate.SQL: WARN                # set to DEBUG to trace SQL; bound values stay hidden
  # Every line carries the request correlation id and user id (see RequestLoggingFilter / LogContext).
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:-}] [u=%X{userId:--}] %-28.28logger{27} : %m%n%wEx"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:-}] [u=%X{userId:--}] %-28.28logger{27} : %m%n%wEx"
  # Set LOGGING_FILE_NAME=/var/log/lifeos/app.log to also write a size/time-rolled file (14 days kept).
  file:
    name: ${LOGGING_FILE_NAME:}
  logback:
    rollingpolicy:
      max-history: 14
      max-file-size: 20MB
