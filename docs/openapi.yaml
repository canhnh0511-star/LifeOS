openapi: 3.1.0
info:
  title: Life OS API
  version: 0.1.0
  description: |
    Contract-first REST API for Life OS. Local dates (YYYY-MM-DD) use the authenticated
    user's IANA timezone; instants use UTC ISO 8601. The frontend's mock and HTTP adapters
    must implement the same shapes. Auth is intentionally absent from the frontend demo.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Identity
  - name: Goals
  - name: Habits
  - name: Quests
  - name: Progress
  - name: Journey
  - name: Analytics
  - name: Bosses
  - name: Achievements
paths:
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      responses:
        '200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/register:
    post:
      tags: [Identity]
      operationId: register
      security: []
      description: Creates an account and signs in (sets the LIFEOS_SESSION cookie). Requires the CSRF header like every mutation; load any GET first to receive the XSRF-TOKEN cookie.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Register'}}}}
      responses:
        '201': {description: Created and signed in, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '409': {description: 'EMAIL_TAKEN', content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /auth/login:
    post:
      tags: [Identity]
      operationId: login
      security: []
      description: Starts a session and issues a new session id and CSRF token. Wrong password and unknown email return the identical 401 INVALID_CREDENTIALS.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Login'}}}}
      responses:
        '200': {description: Signed in, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/logout:
    post:
      tags: [Identity]
      operationId: logout
      security: []
      description: Invalidates the session. Idempotent.
      responses:
        '204': {description: Signed out}
        '403': {$ref: '#/components/responses/CsrfInvalid'}
  /dashboard/today:
    get:
      tags: [Quests]
      operationId: getDashboard
      parameters:
        - {name: date, in: query, required: false, schema: {$ref: '#/components/schemas/LocalDate'}}
      responses:
        '200': {description: Dashboard, content: {application/json: {schema: {$ref: '#/components/schemas/DailyDashboard'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /goals:
    get:
      tags: [Goals]
      operationId: getGoals
      responses:
        '200': {description: Goals, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Goal'}}}}}
    post:
      tags: [Goals]
      operationId: createGoal
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateGoal'}}}}
      responses:
        '201': {description: Created goal, content: {application/json: {schema: {$ref: '#/components/schemas/Goal'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /goals/{id}:
    patch:
      tags: [Goals]
      operationId: updateGoal
      parameters: [{$ref: '#/components/parameters/Id'}]
      description: A status change (pause, resume, archive) or a new weekly schedule takes effect from the next local day; past days and today are unchanged. ARCHIVED is final - an archived habit cannot be edited or reactivated (422 on `patch`).
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PatchGoal'}}}}
      responses:
        '200': {description: Updated goal, content: {application/json: {schema: {$ref: '#/components/schemas/Goal'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /habits:
    get:
      tags: [Habits]
      operationId: getHabits
      responses:
        '200': {description: Habits, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Habit'}}}}}
    post:
      tags: [Habits]
      operationId: createHabit
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateHabit'}}}}
      responses:
        '201': {description: Created habit, content: {application/json: {schema: {$ref: '#/components/schemas/Habit'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /imports/habit-plans:
    post:
      tags: [Imports]
      operationId: importHabitPlan
      description: Creates several goals and their habits in one atomic call (all or nothing). Every record is validated exactly like POST /goals and POST /habits. At most 10 goals and 50 habits per call. Errors - 409 PLAN_ALREADY_IMPORTED (an ACTIVE goal with the same title already exists, or the plan repeats a title); 422 VALIDATION_FAILED with `fields` keyed by position, e.g. `goals[1].habits[0].xpReward`, `startDate`.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ImportHabitPlan'}}}}
      responses:
        '201': {description: Created goals and habits, content: {application/json: {schema: {$ref: '#/components/schemas/ImportedHabitPlan'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /habits/{id}:
    patch:
      tags: [Habits]
      operationId: updateHabit
      parameters: [{$ref: '#/components/parameters/Id'}]
      description: A status change takes effect from the next local day; past days and today are unchanged.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PatchHabit'}}}}
      responses:
        '200': {description: Updated habit, content: {application/json: {schema: {$ref: '#/components/schemas/Habit'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /quests:
    get:
      tags: [Quests]
      operationId: getQuests
      parameters: [{name: date, in: query, required: true, schema: {$ref: '#/components/schemas/LocalDate'}}]
      responses:
        '200': {description: Scheduled quests, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Quest'}}}}}
  /quests/{habitId}/dates/{date}/completion:
    parameters:
      - {name: habitId, in: path, required: true, schema: {type: string}}
      - {name: date, in: path, required: true, schema: {$ref: '#/components/schemas/LocalDate'}}
    put:
      tags: [Quests]
      operationId: completeQuest
      description: Idempotent transition to COMPLETED. Duplicate call returns xpAwarded=0. Errors - 404 NOT_FOUND; 422 QUEST_IN_FUTURE, QUEST_TOO_OLD, QUEST_OUTSIDE_SCHEDULE, VALIDATION_FAILED; 409 QUEST_NOT_ACTIVE (habit or goal paused on that date).
      responses:
        '200': {description: Mutation result, content: {application/json: {schema: {$ref: '#/components/schemas/QuestMutation'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Quests]
      operationId: undoQuest
      description: Idempotent transition to PENDING. A repeated undo returns xpAwarded=0 and reverses exactly the amount awarded in the current cycle. Same errors as PUT.
      responses:
        '200': {description: Mutation result, content: {application/json: {schema: {$ref: '#/components/schemas/QuestMutation'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /quests/{habitId}/dates/{date}/objectives/{objectiveId}:
    parameters:
      - {name: habitId, in: path, required: true, schema: {type: string}}
      - {name: date, in: path, required: true, schema: {$ref: '#/components/schemas/LocalDate'}}
      - {name: objectiveId, in: path, required: true, schema: {type: string}}
    put:
      tags: [Quests]
      operationId: setObjective
      description: Sets the progress of one checklist line to an absolute value (idempotent). The quest completes itself, with the usual ledger event and XP once, when every line has reached its target, and undoes itself when one drops below it. A change that does not flip the quest awards nothing. Same window, schedule and pause rules as the completion endpoints; an unknown line, or one of another quest or user, is 404.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [value], properties: {value: {type: integer, minimum: 0, maximum: 100000}}}}}}
      responses:
        '200': {description: Mutation result, content: {application/json: {schema: {$ref: '#/components/schemas/QuestMutation'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /progress:
    get:
      tags: [Progress]
      operationId: getProgress
      responses:
        '200': {description: Experience and streak, content: {application/json: {schema: {$ref: '#/components/schemas/Progress'}}}}
  /bosses/{bossId}/completion:
    parameters:
      - {name: bossId, in: path, required: true, schema: {type: string}}
    put:
      tags: [Bosses]
      operationId: defeatBoss
      description: Idempotent transition to DEFEATED. Allowed only when the boss is AVAILABLE (area level >= requiredLevel); otherwise BOSS_LOCKED. Duplicate call returns xpAwarded=0. The date used for backdating rules is the current local date.
      responses:
        '200': {description: Mutation result, content: {application/json: {schema: {$ref: '#/components/schemas/BossMutation'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'BOSS_LOCKED - area level below requiredLevel', content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    delete:
      tags: [Bosses]
      operationId: undoBoss
      description: Idempotent transition back to AVAILABLE. Appends a compensating BOSS_REVERT event and may revoke achievements. A repeated undo returns xpAwarded=0.
      responses:
        '200': {description: Mutation result, content: {application/json: {schema: {$ref: '#/components/schemas/BossMutation'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError', description: 'QUEST_TOO_OLD when the boss was defeated more than 7 days ago'}
        '409': {$ref: '#/components/responses/Conflict'}
  /achievements:
    get:
      tags: [Achievements]
      operationId: getAchievements
      description: Achievements of the current campaign (granted once per campaign).
      responses:
        '200': {description: Achievements, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Achievement'}}}}}
  /journeys/current:
    get:
      tags: [Journey]
      operationId: getCurrentJourney
      responses:
        '200': {description: Current journey or null, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/Journey'}, {type: 'null'}]}}}}
  /analytics/weekly:
    get:
      tags: [Analytics]
      operationId: getWeeklyAnalytics
      responses:
        '200': {description: 7 day analytics, content: {application/json: {schema: {$ref: '#/components/schemas/Analytics'}}}}
  /analytics/monthly:
    get:
      tags: [Analytics]
      operationId: getMonthlyAnalytics
      responses:
        '200': {description: 30 day analytics, content: {application/json: {schema: {$ref: '#/components/schemas/Analytics'}}}}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: LIFEOS_SESSION, description: 'Production auth only. HttpOnly, Secure, SameSite=Lax. Mutations also need the X-XSRF-TOKEN header echoing the XSRF-TOKEN cookie (double-submit).'}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string}}
  responses:
    Unauthorized: {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    CsrfInvalid: {description: 'CSRF_INVALID - missing or mismatching X-XSRF-TOKEN header', content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    RateLimited:
      description: 'RATE_LIMITED - too many login/register attempts from this address or for this email; identical for known and unknown emails'
      headers: {Retry-After: {description: Seconds until a retry can succeed, schema: {type: integer}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    NotFound: {description: Not found or not owned, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    Conflict: {description: 'State conflict, e.g. QUEST_NOT_ACTIVE (habit or goal paused on that date)', content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    ValidationError: {description: Input validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  schemas:
    LocalDate: {type: string, format: date, example: '2026-10-13'}
    Instant: {type: string, format: date-time, description: 'UTC timestamp'}
    Category: {type: string, enum: [CAREER, CREATIVITY, HEALTH, KNOWLEDGE, MINDFULNESS]}
    RecordStatus: {type: string, enum: [ACTIVE, PAUSED, ARCHIVED]}
    Weekday: {type: integer, minimum: 1, maximum: 7, description: 'Monday=1, Sunday=7'}
    User:
      type: object
      required: [id, displayName, email, timezone]
      properties:
        id: {type: string}
        displayName: {type: string}
        email: {type: string, format: email}
        timezone: {type: string, example: Asia/Ho_Chi_Minh}
    Goal:
      type: object
      required: [id, title, category, description, status, createdAt]
      properties:
        id: {type: string}
        title: {type: string}
        category: {$ref: '#/components/schemas/Category'}
        description: {type: string}
        status: {$ref: '#/components/schemas/RecordStatus'}
        createdAt: {$ref: '#/components/schemas/Instant'}
    CreateGoal:
      type: object
      required: [title, category, description]
      properties:
        title: {type: string, minLength: 1, maxLength: 150}
        category: {$ref: '#/components/schemas/Category'}
        description: {type: string, maxLength: 600}
    PatchGoal:
      type: object
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 150}
        description: {type: string, maxLength: 600}
        status: {$ref: '#/components/schemas/RecordStatus'}
    Habit:
      type: object
      required: [id, goalId, title, targetMinutes, xpReward, weekdays, startDate, endDate, status, objectives]
      properties:
        objectives: {type: array, items: {$ref: '#/components/schemas/HabitObjective'}, description: 'Checklist; empty = a plain one-tick habit.'}
        id: {type: string}
        goalId: {type: string}
        title: {type: string}
        targetMinutes: {type: integer, minimum: 1}
        xpReward: {type: integer, minimum: 0, maximum: 100}
        weekdays: {type: array, uniqueItems: true, minItems: 1, items: {$ref: '#/components/schemas/Weekday'}}
        startDate: {$ref: '#/components/schemas/LocalDate'}
        endDate: {oneOf: [{$ref: '#/components/schemas/LocalDate'}, {type: 'null'}]}
        status: {$ref: '#/components/schemas/RecordStatus'}
    CreateHabit:
      type: object
      required: [goalId, title, targetMinutes, xpReward, weekdays, startDate]
      properties:
        goalId: {type: string}
        title: {type: string, minLength: 1, maxLength: 150}
        targetMinutes: {type: integer, minimum: 1, maximum: 480}
        xpReward: {type: integer, minimum: 0, maximum: 100}
        weekdays: {type: array, uniqueItems: true, minItems: 1, items: {$ref: '#/components/schemas/Weekday'}}
        startDate: {$ref: '#/components/schemas/LocalDate'}
        objectives: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/ObjectiveInput'}}
    HabitObjective:
      type: object
      required: [id, title, target, unit, step]
      properties:
        id: {type: string}
        title: {type: string, minLength: 1, maxLength: 100}
        target: {type: integer, minimum: 1, maximum: 10000}
        unit: {type: string, maxLength: 20, description: 'Free text (rep, cốc, phút, bước...). Empty with target 1 = a plain tick.'}
        step: {type: integer, minimum: 1, description: 'Size of the quick + / - button; at most target.'}
    ObjectiveInput:
      type: object
      required: [title, target]
      properties:
        title: {type: string, minLength: 1, maxLength: 100}
        target: {type: integer, minimum: 1, maximum: 10000}
        unit: {type: string, maxLength: 20}
        step: {type: integer, minimum: 1}
    QuestObjective:
      allOf:
        - {$ref: '#/components/schemas/HabitObjective'}
        - type: object
          required: [value]
          properties:
            value: {type: integer, minimum: 0, maximum: 100000, description: 'Progress on this day; the quest completes when every line has value >= target.'}
    ImportHabitPlan:
      type: object
      required: [startDate, goals]
      properties:
        startDate: {$ref: '#/components/schemas/LocalDate'}
        goals:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [title, category, description, habits]
            properties:
              title: {type: string, minLength: 1, maxLength: 150}
              category: {$ref: '#/components/schemas/Category'}
              description: {type: string, maxLength: 600}
              habits:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [title, targetMinutes, xpReward, weekdays]
                  properties:
                    title: {type: string, minLength: 1, maxLength: 150}
                    targetMinutes: {type: integer, minimum: 1, maximum: 480}
                    xpReward: {type: integer, minimum: 0, maximum: 100}
                    weekdays: {type: array, uniqueItems: true, minItems: 1, items: {$ref: '#/components/schemas/Weekday'}}
                    objectives: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/ObjectiveInput'}}
    ImportedHabitPlan:
      type: object
      required: [goals, habits]
      properties:
        goals: {type: array, items: {$ref: '#/components/schemas/Goal'}}
        habits: {type: array, items: {$ref: '#/components/schemas/Habit'}}
    PatchHabit:
      type: object
      minProperties: 1
      additionalProperties: false
      description: 'Any subset. One invalid field rejects the whole patch (422). Nothing here rewrites a lived day.'
      properties:
        title: {type: string, minLength: 1, maxLength: 150}
        targetMinutes: {type: integer, minimum: 1, maximum: 480}
        xpReward: {type: integer, minimum: 0, maximum: 100, description: 'Applies from tomorrow: quests of lived days (today and the 7-day edit window) keep the reward they had.'}
        weekdays: {type: array, uniqueItems: true, minItems: 1, items: {$ref: '#/components/schemas/Weekday'}, description: 'Adds a schedule version effective from the next local day; a second change on the same day replaces the first.'}
        endDate: {oneOf: [{$ref: '#/components/schemas/LocalDate'}, {type: 'null'}], description: 'Today or later, or null to clear. Rejected once the habit has already ended (it would bring back lived days).'}
        status: {$ref: '#/components/schemas/RecordStatus'}
        objectives: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/ObjectiveInput'}, description: 'Replaces the whole checklist from the next local day; lived days keep the list they had. [] turns the habit back into a plain tick.'}
    Quest:
      type: object
      required: [habitId, goalId, goalTitle, title, targetMinutes, xpReward, category, date, status, completedAt, objectives]
      properties:
        objectives: {type: array, items: {$ref: '#/components/schemas/QuestObjective'}, description: 'The checklist as it was when the quest was created; empty for a plain tick quest.'}
        habitId: {type: string}
        goalId: {type: string}
        goalTitle: {type: string}
        title: {type: string}
        targetMinutes: {type: integer}
        xpReward: {type: integer}
        category: {$ref: '#/components/schemas/Category'}
        date: {$ref: '#/components/schemas/LocalDate'}
        status: {type: string, enum: [PENDING, COMPLETED, SKIPPED]}
        completedAt: {oneOf: [{$ref: '#/components/schemas/Instant'}, {type: 'null'}]}
    AreaStat:
      type: object
      required: [category, xp, level, levelStartXp, nextLevelXp]
      properties:
        category: {$ref: '#/components/schemas/Category'}
        xp: {type: integer, minimum: 0}
        level: {type: integer, minimum: 1}
        levelStartXp: {type: integer, minimum: 0}
        nextLevelXp: {type: integer, minimum: 0}
    Progress:
      type: object
      required: [totalXp, level, levelStartXp, nextLevelXp, currentStreak, longestStreak, areas]
      description: 'areas luôn có đủ 5 lĩnh vực. totalXp = tổng areas[].xp.'
      properties:
        areas: {type: array, items: {$ref: '#/components/schemas/AreaStat'}}
        totalXp: {type: integer, minimum: 0}
        level: {type: integer, minimum: 1}
        levelStartXp: {type: integer, minimum: 0}
        nextLevelXp: {type: integer, minimum: 0}
        currentStreak: {type: integer, minimum: 0, description: 'Best current habit streak in scheduled sessions.'}
        longestStreak: {type: integer, minimum: 0}
    Journey:
      type: object
      required: [id, title, startDate, durationDays, elapsedDays, totalScheduledToDate, completedToDate, status, chapters]
      properties:
        id: {type: string}
        title: {type: string}
        startDate: {$ref: '#/components/schemas/LocalDate'}
        durationDays: {type: integer, minimum: 7, maximum: 365}
        elapsedDays: {type: integer, minimum: 0}
        totalScheduledToDate: {type: integer, minimum: 0}
        completedToDate: {type: integer, minimum: 0}
        status: {type: string, enum: [ACTIVE, COMPLETED, CANCELLED]}
        chapters: {type: array, items: {$ref: '#/components/schemas/Chapter'}}
    Chapter:
      type: object
      required: [index, title, startDate, endDate, boss, badge]
      properties:
        index: {type: integer, minimum: 1}
        title: {type: string}
        startDate: {$ref: '#/components/schemas/LocalDate'}
        endDate: {$ref: '#/components/schemas/LocalDate'}
        boss: {$ref: '#/components/schemas/Boss'}
        badge: {$ref: '#/components/schemas/ChapterBadge'}
    ChapterBadge:
      type: object
      description: 'Cosmetic reward, earned exactly while the chapter boss is DEFEATED. Carries no XP.'
      required: [code, name, earned]
      properties:
        code: {type: string}
        name: {type: string}
        earned: {type: boolean}
    Boss:
      type: object
      required: [id, code, name, category, targetMinutes, xpReward, tier, requiredLevel, currentAreaLevel, artKey, bossDate, status, defeatedDate, defeatedAt]
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
        category: {$ref: '#/components/schemas/Category'}
        targetMinutes: {type: integer, minimum: 1}
        xpReward: {type: integer, minimum: 1, maximum: 100}
        tier: {type: integer, minimum: 1, maximum: 5, description: '1 Minion <=40 XP, 2 Elite 41-55, 3 Champion 56-70, 4 Legend 71-85, 5 Mythic 86-100'}
        requiredLevel: {type: integer, minimum: 1}
        currentAreaLevel: {type: integer, minimum: 1}
        artKey: {type: string}
        bossDate: {$ref: '#/components/schemas/LocalDate'}
        status: {type: string, enum: [LOCKED, AVAILABLE, DEFEATED]}
        defeatedDate: {oneOf: [{$ref: '#/components/schemas/LocalDate'}, {type: 'null'}]}
        defeatedAt: {oneOf: [{$ref: '#/components/schemas/Instant'}, {type: 'null'}]}
    Achievement:
      type: object
      required: [code, name, description, xpReward, status, earnedAt]
      properties:
        code: {type: string, enum: [STREAK_7, BALANCED, COMEBACK]}
        name: {type: string}
        description: {type: string}
        xpReward: {type: integer, minimum: 1}
        status: {type: string, enum: [LOCKED, EARNED]}
        earnedAt: {oneOf: [{$ref: '#/components/schemas/Instant'}, {type: 'null'}]}
    RewardEffect:
      type: object
      required: [type, code, xpDelta]
      properties:
        type: {type: string, enum: [BOSS_REVERTED, ACHIEVEMENT_GRANTED, ACHIEVEMENT_REVOKED, DAILY_REWARD_GRANTED, DAILY_REWARD_REVOKED]}
        # For DAILY_REWARD_*, `code` is the chest tier (WOOD, SILVER, GOLD).
        code: {type: string}
        xpDelta: {type: integer}
    BossMutation:
      type: object
      required: [bossId, status, xpAwarded, totalXp, level, effects]
      properties:
        bossId: {type: string}
        status: {type: string, enum: [LOCKED, AVAILABLE, DEFEATED]}
        xpAwarded: {type: integer, description: 'Net signed XP delta of this request, including effects; zero for idempotent retry.'}
        totalXp: {type: integer, minimum: 0}
        level: {type: integer, minimum: 1}
        effects: {type: array, items: {$ref: '#/components/schemas/RewardEffect'}}
    DailyDashboard:
      type: object
      required: [date, user, quests, progress, completedCount, scheduledCount, earnedXpToday, journey, dailyRewards, dayStreak]
      properties:
        date: {$ref: '#/components/schemas/LocalDate'}
        user: {$ref: '#/components/schemas/User'}
        quests: {type: array, items: {$ref: '#/components/schemas/Quest'}}
        progress: {$ref: '#/components/schemas/Progress'}
        completedCount: {type: integer, minimum: 0}
        scheduledCount: {type: integer, minimum: 0}
        earnedXpToday: {type: integer}
        journey: {oneOf: [{$ref: '#/components/schemas/Journey'}, {type: 'null'}]}
        dailyRewards:
          type: array
          description: Chests of the requested day with their real state; empty when the day has no quests. `threshold` = completed quests needed (50%/80%/100% of the scheduled, rounded up).
          items: {$ref: '#/components/schemas/DailyReward'}
        dayStreak: {type: integer, minimum: 0, description: 'Consecutive days ending today with at least 50% of the scheduled quests completed; days without quests are skipped, a still-short today does not break it.'}
    DailyReward:
      type: object
      required: [tier, threshold, xp, state]
      properties:
        tier: {type: string, enum: [WOOD, SILVER, GOLD]}
        threshold: {type: integer, minimum: 1}
        xp: {type: integer, enum: [10, 20, 40]}
        state: {type: string, enum: [LOCKED, EARNED]}
    QuestMutation:
      type: object
      required: [habitId, date, status, xpAwarded, totalXp, level, streak, effects, objectives]
      properties:
        objectives: {type: array, items: {$ref: '#/components/schemas/QuestObjective'}, description: 'The quest checklist after this change.'}
        habitId: {type: string}
        date: {$ref: '#/components/schemas/LocalDate'}
        status: {type: string, enum: [PENDING, COMPLETED]}
        xpAwarded: {type: integer, description: 'Net signed XP delta of this request, including effects; zero for idempotent retry.'}
        totalXp: {type: integer, minimum: 0}
        level: {type: integer, minimum: 1}
        streak: {type: integer, minimum: 0}
        effects: {type: array, items: {$ref: '#/components/schemas/RewardEffect'}, description: 'Achievements granted or revoked by this request; their XP is already in xpAwarded.'}
    DayStat:
      type: object
      required: [date, scheduled, completed, xpEarned]
      properties:
        date: {$ref: '#/components/schemas/LocalDate'}
        scheduled: {type: integer, minimum: 0}
        completed: {type: integer, minimum: 0}
        xpEarned: {type: integer}
    CategoryStat:
      type: object
      required: [category, scheduled, completed]
      properties:
        category: {$ref: '#/components/schemas/Category'}
        scheduled: {type: integer, minimum: 0}
        completed: {type: integer, minimum: 0}
    PreviousPeriod:
      type: object
      required: [completionRate, completedCount, scheduledCount, earnedXp, categories]
      properties:
        completionRate: {type: integer, minimum: 0, maximum: 100}
        completedCount: {type: integer, minimum: 0}
        scheduledCount: {type: integer, minimum: 0}
        earnedXp: {type: integer}
        categories: {type: array, items: {$ref: '#/components/schemas/CategoryStat'}}
    Analytics:
      type: object
      required: [period, days, completionRate, completedCount, scheduledCount, earnedXp, categories]
      description: 'categories includes bosses. A category with scheduled=0 means no data (not 0%). previous is optional until the radar chart is implemented, then required.'
      properties:
        previous: {$ref: '#/components/schemas/PreviousPeriod'}
        period: {type: string, enum: [7d, 30d]}
        days: {type: array, items: {$ref: '#/components/schemas/DayStat'}}
        completionRate: {type: integer, minimum: 0, maximum: 100}
        completedCount: {type: integer, minimum: 0}
        scheduledCount: {type: integer, minimum: 0}
        earnedXp: {type: integer}
        categories: {type: array, items: {$ref: '#/components/schemas/CategoryStat'}}
    Register:
      type: object
      required: [email, password, displayName]
      properties:
        email: {type: string, format: email, maxLength: 254, description: 'Case-insensitive; stored lower-cased'}
        password: {type: string, minLength: 10, maxLength: 72, writeOnly: true}
        displayName: {type: string, minLength: 1, maxLength: 60}
        timezone: {type: string, maxLength: 64, description: 'IANA zone; defaults to Asia/Ho_Chi_Minh'}
    Login:
      type: object
      required: [email, password]
      properties:
        email: {type: string}
        password: {type: string, writeOnly: true}
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        fields: {type: object, additionalProperties: {type: string}}
        requestId: {type: string, description: 'Correlation id, also in the X-Request-Id response header; quote it when reporting a problem'}
